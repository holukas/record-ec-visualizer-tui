[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "record-ec-visualizer-tui"
version = "0.1.0"
description = "Real-time visualizer of incoming data from the rECord logging script"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0" }
authors = [{ name = "Lukas Hörtnagl", email = "holukas@ethz.ch" }]

dependencies = [
    "textual>=8.2.7",
    "rich>=15.0.0",
]

[project.scripts]
record-ec-visualizer-tui = "record_ec_visualizer_tui.__main__:main"

[tool.uv]
python-preference = "managed"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.2",
    "textual-dev>=1.7.0",
]

[tool.ruff]
cache-dir = ".ruff_cache"
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F are ruff's defaults; B (bugbear) is added for the bug-shaped rules.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "F541",  # f-string without placeholders: cosmetic only
    "B905",  # zip() without strict=: worth its own sweep, not a blocker
    "B007",  # unused loop control variable: usually a deliberate throwaway
]
